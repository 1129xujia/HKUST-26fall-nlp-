config_version: '1'
seed: 42
pipeline: integrated
integration:
  domain_filter: false
  dense_top_k: 50
  bm25_top_k: 50
data:
  passages_path: data\processed\multidoc2dial\passages.jsonl
  examples_path: data\processed\multidoc2dial\validation.jsonl
  source: multidoc2dial
  split: validation
  raw_dir: data\raw\multidoc2dial
  processed_dir: data\processed\multidoc2dial
  dev_ratio: 0.1
  mini_size: 20
  chunk_size: 800
  chunk_overlap: 120
models:
  llm:
    backend: deepseek
    model: deepseek-flash
    revision: null
    local_path: null
    device: cpu
    max_new_tokens: 1024
    max_input_tokens: 16384
    num_threads: 4
    timeout_seconds: 45
  embedding:
    backend: transformers
    model: sentence-transformers/all-MiniLM-L6-v2
    dimensions: 384
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    local_path: artifacts\models\embedding
    max_length: 256
    batch_size: 32
    num_threads: 4
  reranker:
    model: cross-encoder/ms-marco-MiniLM-L6-v2
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    local_path: artifacts\models\reranker
    max_length: 512
    batch_size: 16
    num_threads: 4
planning:
  use_history: true
  rewrite: true
  decompose: true
  max_sub_queries: 3
retrieval:
  branches:
  - dense
  - bm25
  per_branch_top_k: 20
  fusion: rrf
  rrf_k: 30
  candidate_top_k: 30
  rerank: true
  final_top_k: 5
quality:
  enabled: false
  relevance_threshold: 0.7
  sufficiency_threshold: 0.7
  groundedness_threshold: 0.8
  dialogue_consistency_threshold: 0.8
optimization:
  enabled: false
  max_retries: 2
  stop_if_no_new_evidence: true
budget:
  max_latency_seconds: 180.0
  max_total_tokens: 30000
escalation:
  enabled: false
paths:
  index_dir: artifacts\indexes\multidoc2dial_minilm
  results_dir: results
