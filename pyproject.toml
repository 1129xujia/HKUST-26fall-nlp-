[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-service-rag"
version = "0.1.0"
description = "HKUST NLP: modular multi-agent customer-service RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.11.7",
    "PyYAML==6.0.2",
    "typer==0.16.0",
    "click==8.2.1",
    "numpy==2.2.6",
    "Jinja2==3.1.6",
    "rank-bm25==0.2.2",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = ["ruff==0.12.1"]
local = [
    "torch==2.8.0",
    "transformers==4.56.2",
    "huggingface-hub==0.35.3",
    "safetensors==0.6.2",
]

[project.scripts]
cs-rag = "customer_service_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_service_rag = ["prompts/*.jinja2"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
