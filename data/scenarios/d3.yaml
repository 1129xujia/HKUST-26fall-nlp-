# These are authored mock service outputs, not reference answers or dataset labels.
scenario_version: 1
scenarios:
  pass:
    description: Direct pass with a supported extractive mock answer.
    dialogue: &license
      conversation_id: scenario_license
      current_message: Which form replaces a lost driving license?
      dialogue_history: []
    feedback:
      - &pass
        relevance: 0.95
        sufficiency: 0.95
        groundedness: 1.0
        dialogue_consistency: 1.0
        decision: pass
        reason: Scripted approval for control-flow demonstration only.
  retry-retrieve:
    description: Expand final evidence from one to three passages, then receive scripted approval.
    dialogue: *license
    config_overrides:
      retrieval: {final_top_k: 1}
    feedback:
      - &retrieve_retry
        relevance: 0.9
        sufficiency: 0.3
        groundedness: 1.0
        dialogue_consistency: 1.0
        decision: retry
        missing_information: Mock feedback requests a broader evidence set.
        suggested_action: adjust_retrieval
        reason: Scripted evidence-expansion request.
      - *pass
    actions:
      - action: adjust_retrieval
        reason: Expand selected evidence from one to three passages.
        retrieval_options:
          branches: [dense, bm25]
          per_branch_top_k: 10
          fusion: rrf
          rrf_k: 60
          candidate_top_k: 10
          rerank: false
          final_top_k: 3
  retry-regenerate:
    description: Replace an incomplete mock draft using the same retrieved passages.
    dialogue: *license
    generation_modes: [incomplete, extract]
    feedback:
      - &draft_retry
        relevance: 0.3
        sufficiency: 0.9
        groundedness: 0.0
        dialogue_consistency: 1.0
        decision: retry
        missing_information: The candidate draft does not yet answer the question.
        suggested_action: regenerate
        reason: Scripted draft-repair request.
      - *pass
    actions:
      - &regenerate
        action: regenerate
        reason: Reuse existing evidence for a new draft without retrieval.
  clarify:
    description: Ask which service the user means and stop without guessing.
    dialogue:
      conversation_id: scenario_clarify
      current_message: How do I renew it?
      dialogue_history: []
    feedback:
      - relevance: 0.2
        sufficiency: 0.0
        groundedness: 1.0
        dialogue_consistency: 0.2
        decision: clarify
        reason: The user has not named the service.
        clarification_question: Are you renewing student aid or a driving license?
        suggested_action: clarify
  escalate:
    description: Prepare a handoff for an explicit human request; no actual agent is contacted.
    dialogue:
      conversation_id: scenario_escalate
      current_message: I need a human to review my student aid case.
      dialogue_history: []
    feedback:
      - relevance: 0.9
        sufficiency: 0.9
        groundedness: 1.0
        dialogue_consistency: 1.0
        decision: escalate
        reason: The user explicitly requested a human reviewer.
        suggested_action: escalate
  retry-limit:
    description: Three rejected drafts exhaust the two-retry budget.
    dialogue: *license
    generation_modes: [incomplete, incomplete, incomplete]
    feedback: [*draft_retry, *draft_retry, *draft_retry]
    actions: [*regenerate, *regenerate]
  no-new-evidence:
    description: A larger branch top-k produces the same selected evidence and stops retrieval.
    dialogue: *license
    config_overrides:
      retrieval: {per_branch_top_k: 20}
    feedback: [*retrieve_retry]
    actions:
      - action: adjust_retrieval
        reason: Increase branch top-k after the small corpus is already exhausted.
        retrieval_options:
          branches: [dense, bm25]
          per_branch_top_k: 21
          fusion: rrf
          rrf_k: 60
          candidate_top_k: 10
          rerank: false
          final_top_k: 3
  token-budget:
    description: Reject the first mock completion when its estimated usage exceeds the budget.
    dialogue: *license
    config_overrides:
      budget: {max_total_tokens: 1}
    feedback: [*pass]
  latency-budget:
    description: Cancel a delayed mock evaluator when the request deadline is reached.
    dialogue: *license
    config_overrides:
      budget: {max_latency_seconds: 0.05}
    evaluation_delay_seconds: 0.2
    feedback: [*pass]
  no-escalation:
    description: With escalation disabled, exhaustion returns insufficient evidence.
    dialogue: *license
    config_overrides:
      escalation: {enabled: false}
      optimization: {max_retries: 0}
    generation_modes: [incomplete]
    feedback: [*draft_retry]
  rewrite-query:
    description: Execute a structured rewritten query before the next retrieval.
    dialogue: *license
    config_overrides:
      optimization: {stop_if_no_new_evidence: false}
    feedback: [*retrieve_retry, *pass]
    actions:
      - action: rewrite_query
        reason: Demonstrate execution of a rewritten retrieval query.
        rewritten_query: Lost driving license replacement form DL-L2
  add-sub-queries:
    description: Add an explicit sub-query before the next retrieval.
    dialogue: *license
    config_overrides:
      optimization: {stop_if_no_new_evidence: false}
    feedback: [*retrieve_retry, *pass]
    actions:
      - action: add_sub_queries
        reason: Demonstrate adding a retrieval sub-question.
        sub_queries: ["Which replacement form is DL-L2?"]
