data:
  source: multidoc2dial
  passages_path: data/processed/multidoc2dial/passages.jsonl
  examples_path: data/processed/multidoc2dial/mini.jsonl
  raw_dir: data/raw/multidoc2dial
  processed_dir: data/processed/multidoc2dial
  chunk_size: 800
  chunk_overlap: 120
  mini_size: 20
models:
  llm:
    backend: deepseek
    model: deepseek-flash
    max_new_tokens: 1024
    max_input_tokens: 16384
    timeout_seconds: 45
  embedding:
    backend: transformers
    model: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    local_path: artifacts/models/embedding
    dimensions: 384
    max_length: 256
    batch_size: 32
    num_threads: 4
  reranker:
    model: cross-encoder/ms-marco-MiniLM-L6-v2
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    local_path: artifacts/models/reranker
    max_length: 512
    batch_size: 16
    num_threads: 4
planning:
  decompose: true
retrieval:
  dense_top_k: 50
  bm25_top_k: 50
  rrf_k: 30
  candidate_top_k: 30
  final_top_k: 5
  rerank: true
budget:
  max_latency_seconds: 180
  max_total_tokens: 30000
paths:
  index_dir: artifacts/indexes/multidoc2dial_minilm
