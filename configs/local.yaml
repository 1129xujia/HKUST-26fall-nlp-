# D4/D5 real local models; the default D2/D3 mock configs remain available.
data:
  source: multidoc2dial
  passages_path: data/processed/multidoc2dial/passages.jsonl
  examples_path: data/processed/multidoc2dial/mini.jsonl
  split: mini
  chunk_size: 800
  chunk_overlap: 120
  dev_ratio: 0.1
  mini_size: 20
models:
  llm:
    backend: transformers
    model: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775
    local_path: artifacts/models/llm
    device: cpu
    num_threads: 4
    max_new_tokens: 384
    max_input_tokens: 3072
  embedding:
    backend: transformers
    model: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    local_path: artifacts/models/embedding
    dimensions: 384
    max_length: 256
    batch_size: 32
    num_threads: 4
  reranker:
    model: cross-encoder/ms-marco-MiniLM-L6-v2
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    local_path: artifacts/models/reranker
    max_length: 512
    batch_size: 16
    num_threads: 4
planning:
  use_history: true
  rewrite: true
  decompose: true
retrieval:
  branches: [dense, bm25]
  per_branch_top_k: 20
  fusion: rrf
  candidate_top_k: 20
  rerank: true
  final_top_k: 3
quality:
  enabled: true
optimization:
  enabled: true
  max_retries: 2
escalation:
  enabled: true
budget:
  max_latency_seconds: 180
  max_total_tokens: 20000
paths:
  index_dir: artifacts/indexes/multidoc2dial_minilm
