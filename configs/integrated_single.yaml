# Same retrieval/planning/generation as integrated.yaml, with quality loop disabled.
base_config: local.yaml
pipeline: integrated
models:
  llm:
    backend: deepseek
    model: deepseek-flash
    revision: null
    local_path: null
    max_new_tokens: 1024
    max_input_tokens: 16384
    timeout_seconds: 45
integration:
  domain_filter: false
  dense_top_k: 50
  bm25_top_k: 50
retrieval:
  candidate_top_k: 30
  final_top_k: 5
  rrf_k: 30
  rerank: true
quality:
  enabled: false
optimization:
  enabled: false
escalation:
  enabled: false
budget:
  max_latency_seconds: 180
  max_total_tokens: 30000
